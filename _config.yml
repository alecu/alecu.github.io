title: alecu
description: "Retrofuturismo con alecu"
lang: en
email: alecu@protocultura.net
url: "https://alecu.protocultura.net"
baseurl: ""

twitter_username: alecura
github_username: alecu
linkedin_username: alecura
launchpad_username: alecu
instagram_username: alecura83

markdown: kramdown
highlighter: rouge
permalink: pretty

plugins:
  - jekyll-seo-tag
  - jekyll-redirect-from

collections:
  projects:
    output: true
    permalink: /projects/:name/

defaults:
  - scope:
      path: ""
    values:
      lang: en
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: projects
    values:
      layout: project

exclude:
  - PLAN.md
  - Gemfile
  - Gemfile.lock
  - scripts
  - vendor
  - node_modules
