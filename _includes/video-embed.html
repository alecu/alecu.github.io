{% comment %}
  Click-to-load YouTube player. Pass `id` and `title`; optionally `class`, and `thumb: maxresdefault`
  for a sharper picture where the player is large. js/video.js swaps the button for the iframe.
{% endcomment %}
<div class="demo__video{% if include.class %} {{ include.class }}{% endif %}">
    <button type="button" data-youtube="{{ include.id }}" style="background-image:url('https://i.ytimg.com/vi/{{ include.id }}/{{ include.thumb | default: 'hqdefault' }}.jpg')" aria-label="Play {{ include.title }}"></button>
</div>
