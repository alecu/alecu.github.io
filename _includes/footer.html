{% assign t = site.data.i18n[page.lang] %}
<footer class="site-footer">
    <div class="wrap site-footer__inner">
        <ul class="social">
            <li><a href="https://github.com/{{ site.github_username }}">GitHub</a></li>
            {% if site.instagram_username %}<li><a href="https://instagram.com/{{ site.instagram_username }}">Instagram</a></li>{% endif %}
            <li><a href="https://twitter.com/{{ site.twitter_username }}">Twitter</a></li>
            <li><a href="https://linkedin.com/in/{{ site.linkedin_username }}">LinkedIn</a></li>
            <li><a href="https://launchpad.net/~{{ site.launchpad_username }}">Launchpad</a></li>
            <li><a href="mailto:{{ site.email }}">{{ site.email }}</a></li>
            <li><a href="{{ '/feed.xml' | prepend: site.baseurl }}">{{ t.footer.feed }}</a></li>
        </ul>
        <p class="copyright">
            &copy; {{ site.time | date: '%Y' }} Alejandro J. Cura.
            {{ t.footer.license }}
            <a rel="license" href="https://creativecommons.org/licenses/by-sa/4.0/">CC BY-SA 4.0</a>.
        </p>
    </div>
</footer>
